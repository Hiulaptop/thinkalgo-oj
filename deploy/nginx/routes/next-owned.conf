# Danh sách trang do Next.js phục vụ. MỖI TRANG MỘT KHỐI, thứ tự trạng thái:
#   (không có)  -> Django phục vụ (mặc định)
#   preview     -> chỉ người có cookie web_preview=1 thấy bản Next.js
#   live        -> mọi GET/HEAD vào Next.js, Django là phương án dự phòng
#
# Quy tắc khớp đường dẫn:
#   - URL phải giống hệt URL chuẩn của Django, kể cả dấu "/" cuối
#     (Django: /problems nhưng /submissions/). Dùng `location =` hoặc regex có `$`.
#   - KHÔNG dùng prefix rộng (vd `location /problem/`), vì sẽ nuốt các route con
#     còn thuộc Django (/problem/<mã>/submit, /problem/<mã>/data ...).
#   - Biến thể không chuẩn (thiếu/thừa "/") để Django tự chuyển hướng/404.
#
# Mẫu (mặc định để trống; thêm khi một change trang được approve):
#
#   location = /blogs/ {
#       set $page_owner $owner_preview;      # đổi thành $owner_live khi mở cho mọi người
#       include /var/www/thinkcodeoj/nginx/snippets/route-page.conf;
#   }
#
#   location ~ ^/problem/[^/]+$ {            # chỉ trang chi tiết, không phải route con
#       set $page_owner $owner_preview;
#       include /var/www/thinkcodeoj/nginx/snippets/route-page.conf;
#   }
