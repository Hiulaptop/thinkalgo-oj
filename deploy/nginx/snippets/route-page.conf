# Dùng trong mỗi location của trang đã chuyển. Đặt `set $page_owner` ngay trước
# khi include (owner_live hoặc owner_preview). Xem routes/next-owned.conf.
#
# Request GET/HEAD vào web_with_fallback: Next.js hỏng (lỗi kết nối, timeout,
# 500/502/503/504) thì nginx thử lại trên server dự phòng là Django (trang Jinja).
# Request khác (POST...) đi thẳng tới Django với giới hạn kích thước/thời gian
# của Django, và không bao giờ bị gửi lặp.
# Chính sách Cache-Control cho HTML do Next.js tự đặt (next.config.ts headers()).
proxy_pass http://$page_owner;
proxy_http_version 1.1;
proxy_set_header Connection "";
include /var/www/thinkcodeoj/nginx/snippets/proxy-headers.conf;
client_max_body_size 200m;
proxy_read_timeout 120s;
proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
proxy_next_upstream_tries 2;
