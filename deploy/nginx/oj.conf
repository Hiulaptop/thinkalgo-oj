# ThinkAlgo OJ: server block. Cả thư mục deploy/nginx/ được chép vào
# /var/www/thinkcodeoj/nginx/ (user deploy ghi được, không cần root); nginx chính
# chỉ cần một dòng, thiết lập một lần bởi root:
#     include /var/www/thinkcodeoj/nginx/oj.conf;
# Đường dẫn include là TUYỆT ĐỐI: include tương đối của nginx được tính từ thư mục
# cấu hình chính (/etc/nginx), không phải từ file đang include.
# LƯU Ý: cấu hình production thật không nằm trong repo trước đây. Các giá trị nền
# (timeout, kích thước upload, cache /static/, vị trí icons/, realip) là ĐỀ XUẤT và
# PHẢI đối chiếu với `nginx -T` của server thật (task 1.1 của change
# monorepo-compose-layout) trước khi áp dụng lên production.

include /var/www/thinkcodeoj/nginx/upstreams.conf;
include /var/www/thinkcodeoj/nginx/maps.conf;

server {
    listen 80;
    server_name oj.thinkcode.vn;

    # IP thật của người dùng phía sau Cloudflare. File này sinh từ danh sách IP
    # chính thức của Cloudflare (set_real_ip_from ...; real_ip_header CF-Connecting-IP;).
    include /var/www/thinkcodeoj/nginx/snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/oj.access.log oj_upstream;

    client_max_body_size 200m;

    # Cloudflare Flexible SSL: nginx chỉ thấy HTTP, nên chuyển hướng do nginx tạo
    # (vd /blogs -> /blogs/) phải dùng đường dẫn tương đối, không được sinh ra
    # http://host/... làm người dùng HTTPS bị đẩy sang HTTP.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;

    # --- File tĩnh do nginx phục vụ trực tiếp ---------------------------------
    location /static/ {
        alias /var/www/thinkcodeoj/static/;
    }
    location ^~ /static/cache/ {
        # Do django-compressor sinh, tên chứa hash nội dung.
        alias /var/www/thinkcodeoj/static/cache/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /media/ {
        alias /var/www/thinkcodeoj/media/;
    }
    location = /robots.txt {
        alias /var/www/thinkcodeoj/static-passthrough/robots.txt;
    }
    location = /502.html {
        internal;
        alias /var/www/thinkcodeoj/static-passthrough/502.html;
    }
    error_page 502 /502.html;

    # --- Next.js: tài nguyên build và kiểm tra sống ---------------------------
    location ^~ /_next/ {
        proxy_pass http://web_app;
        include /var/www/thinkcodeoj/nginx/snippets/proxy-next.conf;
        # Next.js đã gửi "public, max-age=31536000, immutable" cho /_next/static/.
    }
    location = /web-healthz {
        allow 127.0.0.1;
        deny all;
        access_log off;
        proxy_pass http://web_app;
        include /var/www/thinkcodeoj/nginx/snippets/proxy-next.conf;
    }

    # --- WebSocket và long-poll cho cập nhật trực tiếp ------------------------
    location /event/ {
        proxy_pass http://wsevent_get/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /var/www/thinkcodeoj/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /channels/ {
        proxy_pass http://wsevent_poll;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        include /var/www/thinkcodeoj/nginx/snippets/proxy-headers.conf;
        proxy_buffering off;
        proxy_read_timeout 120s;   # long-poll của daemon là 29s
    }

    # --- Trang đã chuyển sang Next.js ------------------------------------------
    include /var/www/thinkcodeoj/nginx/routes/next-owned.conf;

    # --- Mặc định: Django -----------------------------------------------------
    location ^~ /admin/ {
        proxy_pass http://django_app;
        include /var/www/thinkcodeoj/nginx/snippets/proxy-django.conf;
        proxy_read_timeout 600s;   # uwsgi --harakiri 600
    }
    location / {
        proxy_pass http://django_app;
        include /var/www/thinkcodeoj/nginx/snippets/proxy-django.conf;
        proxy_read_timeout 120s;
    }
}
