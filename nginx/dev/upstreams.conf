# Upstream cho docker-compose.dev.yml (tên service thay cho 127.0.0.1).
upstream django_app {
    server site:8000;
}

upstream web_app {
    server web:3000;
    keepalive 16;
}

upstream web_with_fallback {
    server web:3000;
    server site:8000 backup;
    keepalive 16;
}

upstream wsevent_get {
    server wsevent:15100;
}

upstream wsevent_poll {
    server wsevent:15102;
}
