{% extends 'base.html' %}
{% block body %}
<h2>Import bài tập từ ZIP</h2>
<p>Gói gồm statement.md, editorial.md, solution.cpp và các cặp tests/*.in, tests/*.out. Tối đa 100 MiB.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <p><label for="package">File ZIP</label> <input id="package" name="package" type="file" accept=".zip" required></p>
    <button type="submit">Đọc gói và xem trước</button>
</form>
{% endblock %}
