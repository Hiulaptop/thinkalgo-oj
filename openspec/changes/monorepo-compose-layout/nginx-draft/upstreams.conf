# Upstream của site ThinkAlgo OJ. Chỉ file này đổi khi chuyển sang mạng bridge
# (tên service thay cho 127.0.0.1).

upstream django_app {
    server 127.0.0.1:8000;
    # Không bật keepalive: uwsgi --http-socket chưa được xác nhận hỗ trợ.
}

upstream web_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Dành cho trang đã chuyển: Next.js trước, Django là dự phòng. Django chỉ được
# gọi khi Next.js lỗi kết nối/timeout/5xx (xem snippets/route-page.conf).
# nginx chỉ thử lại phương thức idempotent (GET/HEAD) nên không bao giờ gửi lặp POST.
upstream web_with_fallback {
    server 127.0.0.1:3000;
    server 127.0.0.1:8000 backup;
    keepalive 16;
}

upstream wsevent_get {
    server 127.0.0.1:15100;
}

upstream wsevent_poll {
    server 127.0.0.1:15102;
}
