# Cổng định tuyến cho từng trang đã chuyển sang Next.js (xem routes/next-owned.conf).
#
#   owner_live    : mọi GET/HEAD vào Next.js; các method khác luôn về Django
#                   (Next.js chưa nhận form/POST).
#   owner_preview : chỉ GET/HEAD có cookie web_preview=1 vào Next.js (thử nội bộ).
#
# "proxy_pass http://$biến" với tên khớp khối upstream không cần resolver.
map $request_method $owner_live {
    default django_app;
    GET     web_with_fallback;
    HEAD    web_with_fallback;
}

map "$request_method:$cookie_web_preview" $owner_preview {
    default  django_app;
    "GET:1"  web_with_fallback;
    "HEAD:1" web_with_fallback;
}

# Cloudflare Flexible SSL: nginx chỉ thấy HTTP, giao thức gốc nằm ở X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

log_format oj_upstream '$remote_addr cf=$http_cf_connecting_ip [$time_local] "$request" '
                       '$status $body_bytes_sent rt=$request_time '
                       'up=$upstream_addr us=$upstream_status urt=$upstream_response_time '
                       'rid=$request_id ray=$http_cf_ray';
